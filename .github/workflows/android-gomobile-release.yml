name: Build OMN-Go

on:
  push:
    branches: [master, DS]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # RUNNER_TEMP is outside the checkout, so the Docker build context never
      # takes the keystore. The build gets it only as a BuildKit secret.
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/omn-go.keystore"

      # The docker-container driver does not share the runner's image store, so
      # a second build cannot do `FROM omn-go-base:latest`. Dockerfile.ci builds
      # both stages as one graph. type=gha carries the layer and cache-mount
      # contents between runs. The secret ids must match Dockerfile.ci.
      - name: Build and export artifacts
        run: |
          docker buildx build \
            -f Dockerfile.ci \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/omn-go.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --cache-from type=gha,scope=omngo \
            --cache-to type=gha,mode=max,scope=omngo \
            .
          ls -la artifacts/
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omn-go.keystore"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Create Release (tag push only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OMN-Go ${{ steps.version.outputs.version }}
          files: |
            artifacts/omn-go-*-desktop-*
            artifacts/omn-go-*-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
