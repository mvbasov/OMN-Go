name: Build OMN-Go

on:
  push:
    branches: [master, DS]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Decode the keystore to a path OUTSIDE the checkout (RUNNER_TEMP), so it
      # is never captured by the Docker build context / `COPY . .` and never
      # baked into an image layer. It is handed to the build only as a
      # BuildKit secret (id=keystore) in the step below.
      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/omn-go.keystore"

      # Built from the Dockerfile, the same file as the local build
      # (local/build.sh) and GitLab. It holds all stages in one BuildKit
      # graph. See the header of the Dockerfile for the reason.
      #
      # --cache-from/--cache-to type=gha keeps the LAYER cache in GitHub's
      # Actions cache between workflow runs. mode=max also keeps the layers
      # of the inner stages (sys_env, android_env, go_env, base_env), thus
      # an unchanged toolchain set-up is skipped on the next run. The
      # contents of the --mount=type=cache directories (/go/pkg/mod,
      # go-build, gradle, /tmp/dl) are NOT exported: BuildKit keeps them on
      # the builder only, and each runner is a new VM. A step that must run
      # again thus downloads again here.
      #
      # Signing material is passed as BuildKit secrets (NOT --build-arg), so
      # it never lands in the image layers or `docker history`. The secret
      # ids must match what the Dockerfile mounts: keystore, keystore_password,
      # key_alias, key_password. env= reads the value from the step env below;
      # src= reads the keystore file decoded in the previous step.
      #
      # Export ONLY the build outputs to ./artifacts via the `export` stage,
      # instead of --load'ing the multi-GB toolchain image into the Docker
      # daemon and copying files out of a container. No image tar / daemon
      # import means far less disk use (and it's faster).
      - name: Build and export artifacts
        run: |
          docker buildx build \
            --target export \
            --output type=local,dest=artifacts \
            --secret id=keystore,src="${RUNNER_TEMP}/omn-go.keystore" \
            --secret id=keystore_password,env=KEYSTORE_PASSWORD \
            --secret id=key_alias,env=KEY_ALIAS \
            --secret id=key_password,env=KEY_PASSWORD \
            --build-arg "OMN_GO_COMMIT=$(git rev-parse HEAD)" \
            --build-arg "OMN_GO_COMMIT_TIME=$(git log -1 --format=%cI)" \
            --cache-from type=gha,scope=omngo \
            --cache-to type=gha,mode=max,scope=omngo \
            .
          ls -la artifacts/
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/omn-go.keystore"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' backend/version.go)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

