<div class="config-panel">
    <h2 class="config-title">Status</h2>
    <div class="config-field">
        <span class="config-hint">What this application does now. The page reads <code class="st-code">/api/status</code>. Two parts cost time, so they load when you ask for them: the storage counts and the git worktree state.</span>
    </div>

    <div class="st-actions">
        <button type="button" class="st-btn" id="stReload">Reload</button>
        <button type="button" class="st-btn" id="stStorage">Storage</button>
        <button type="button" class="st-btn" id="stDirty">Git worktree</button>
        <button type="button" class="st-btn" id="stCopy">Copy as Markdown</button>
        <a class="st-btn" href="/api/status?sections=all&amp;format=md">Open as text</a>
        <a class="st-btn" href="/api/status?sections=all">Open as JSON</a>
    </div>

    <div id="stBody" class="st-body">Loading…</div>
</div>
<!--
  The stylesheet and the script of this page. Neither one is inline, thus
  the template holds markup alone. See section 4 of CLAUDE.md, and the Log
  page, which was built this way from the start.

  The link sits in the body and not in the head, the same as the Log page
  and the Bookmarks note. A browser reads it after the head, thus a rule
  here wins against a rule of omn-go-core.css at equal specificity.
-->
<link rel="stylesheet" type="text/css" href="/css/OMN-Go/omn-go-status.css" />
<script src="/js/OMN-Go/omn-go-status.js"></script>
