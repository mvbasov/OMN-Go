<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit: %%TITLE_HTML%%</title>
    <!-- Theme variables + Material Icons font come from the shared core
         stylesheet; the runtime marker below is replaced server-side with
         the data-theme setter so there is no flash of the wrong theme. -->
    <link rel="stylesheet" href="/css/omn-go-core.css">
    <script>
      // Context for omn-go-editor.js. The note SOURCE is deliberately NOT
      // present here - the editor fetches it from /api/note on load, so a
      // rendered page never carries a second, hidden copy of its own text.
      var OMN_EDIT_NAME = '%%NAME_JS%%';
      var OMN_EDIT_EXT  = '%%PAGE_EXT_JS%%';
      var OMN_EDIT_VIEW = '%%VIEW_URL_JS%%';
    </script>
    <meta id="omn-go-runtime-vars-marker">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            display: flex; flex-direction: column;
            background: var(--bg); color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .omn-editor-bar {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 10px;
            background: var(--bg-band);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
        }
        .omn-editor-spacer { flex: 1 1 auto; }
        .omn-editor-bar button {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--bg-surface); color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 4px; cursor: pointer;
            padding: 4px 8px; line-height: 1;
        }
        .omn-editor-bar button:hover { background: var(--bg-hover); }
        .omn-editor-bar button.active {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .omn-editor-bar button:disabled { opacity: 0.4; cursor: default; }
        .omn-editor-bar button:disabled:hover { background: var(--bg-surface); }
        .omn-editor-bar .material-icons { font-size: 20px; }
        .omn-editor-tools { display: inline-flex; gap: 4px; align-items: center; }
        .omn-editor-tools::after {
            content: ""; width: 1px; align-self: stretch;
            background: var(--border); margin: 0 4px;
        }
        /* -- Find / replace bar -------------------------------------
           A block between the toolbar and the text, so opening it pushes
           the note down rather than covering it. Rows wrap on a narrow
           screen; the query field is the only thing that grows. */
        .omn-editor-find {
            display: flex; flex-direction: column; gap: 4px;
            padding: 6px 8px;
            background: var(--bg-band);
            border-bottom: 1px solid var(--border);
        }
        .omn-editor-find[hidden] { display: none; }
        .omn-editor-find-row {
            display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
        }
        .omn-editor-find-row[hidden] { display: none; }
        .omn-editor-find input {
            flex: 1 1 8em; min-width: 6em;
            padding: 4px 6px;
            background: var(--bg-surface); color: var(--text);
            border: 1px solid var(--border); border-radius: 4px;
            font-family: inherit; font-size: 13px;
        }
        .omn-editor-find input:focus { outline: 1px solid var(--accent); }
        /* A query that cannot compile: said with colour as well as words,
           because the count text is small and easy to miss mid-typing. */
        .omn-editor-find input.is-invalid { border-color: var(--danger); }
        .omn-editor-find button {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--bg-surface); color: var(--text);
            border: 1px solid var(--border-strong);
            border-radius: 4px; cursor: pointer;
            padding: 4px 8px; line-height: 1;
        }
        .omn-editor-find button:hover { background: var(--bg-hover); }
        .omn-editor-find button.active {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }
        .omn-editor-find .material-icons { font-size: 20px; }
        /* The three mode flags are labelled with text, not icons - "Aa",
           "ab", ".*" are what every editor uses and they need no legend. */
        .omn-find-flag {
            font-family: monospace; font-size: 12px; font-weight: 700;
            min-width: 2.2em;
        }
        .omn-find-word { font-size: 12px; }
        .omn-editor-find-count {
            font-size: 12px; color: var(--text-muted);
            min-width: 5em; text-align: right; white-space: nowrap;
        }
        /* Keeps the replace field aligned under the find field despite the
           chevron button occupying the first slot of the row above. */
        .omn-find-chevron-space { width: 30px; flex: 0 0 auto; }

        #editorSave { border-color: var(--accent); color: var(--accent); font-weight: 600; }
        #editorSave:hover { background: var(--accent); color: #fff; }
        /* Editing area: a horizontal row of [line-number gutter][textarea].
           The gutter shows only when line numbers are on AND word wrap is
           off (body.ln-on) - under wrapping the two can't stay aligned, so
           the toggle is forced off while wrapping. The gutter's font-size,
           line-height and top padding must match the textarea's exactly or
           the numbers drift. */
        .omn-editor-main { display: flex; flex: 1 1 auto; min-height: 0; }
        .omn-editor-gutter {
            display: none; flex: 0 0 auto;
            box-sizing: border-box; overflow: hidden;
            padding: 12px 8px 12px 10px; margin: 0;
            text-align: right; white-space: pre;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px; line-height: 1.5;
            color: var(--text-dim); background: var(--bg-band);
            border-right: 1px solid var(--border);
            user-select: none; -webkit-user-select: none;
        }
        body.ln-on .omn-editor-gutter { display: block; }
        /* The pane carries the surface colour so the textarea above it can be
           transparent, letting the mirror's marks show through. */
        .omn-editor-pane {
            position: relative; display: flex;
            flex: 1 1 auto; min-width: 0;
            background: var(--bg-surface);
        }
        .omn-editor #editor {
            display: block; flex: 1 1 auto; min-width: 0;
            box-sizing: border-box; border: none; outline: none;
            padding: 12px 14px; margin: 0; resize: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px; line-height: 1.5; tab-size: 4;
            white-space: pre-wrap; overflow-x: hidden;
            background: transparent; color: var(--text);
            /* Positioned so it paints ABOVE the absolutely-positioned mirror:
               without this the mirror would cover the text being edited. */
            position: relative; z-index: 1;
        }
        /* Word wrap off: don't wrap, scroll horizontally instead. */
        .omn-editor #editor.nowrap { white-space: pre; overflow-x: auto; }

        /* -- Find match mirror --
           Same box, same font, same wrapping as #editor; text in invisible ink
           so only the <mark> backgrounds are seen. Any divergence from #editor
           above shows up as highlights sliding off the words they mark. */
        .omn-editor-mirror {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            box-sizing: border-box;
            padding: 12px 14px; margin: 0;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 14px; line-height: 1.5; tab-size: 4;
            white-space: pre-wrap;
            overflow: hidden;
            color: transparent;
            z-index: 0;
            pointer-events: none;
            user-select: none; -webkit-user-select: none;
        }
        .omn-editor-mirror.nowrap { white-space: pre; }
        .omn-editor-mirror mark {
            color: transparent;
            background: var(--search-hit-bg);
            border-radius: 2px;
        }
        /* The one the counter is pointing at. A ring rather than a different
           colour, so it reads as "this one of them", not "a different kind". */
        .omn-editor-mirror mark.is-current {
            outline: 2px solid var(--accent);
            outline-offset: 1px;
        }
        .omn-editor-status {
            display: flex; align-items: center; gap: 8px;
            padding: 4px 12px; font-size: 12px;
            background: var(--bg-band); border-top: 1px solid var(--border);
            color: var(--text-faint); min-height: 1.2em;
        }
        /* File name (left), shown persistently; transient Loading/Saving/
           error text reuses this span. Unsaved state is the dot, not text. */
        #editorStatus {
            flex: 1 1 auto; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .editor-status-error { color: #ff5555; }
        .editor-status-ok    { color: #3fb950; }
        /* State dot at the right: green = saved, red = unsaved changes.
           Pure CSS circle (border-radius:50%), no image asset. */
        .omn-editor-dot {
            flex: 0 0 auto; width: 10px; height: 10px;
            border-radius: 50%; background: var(--text-dim);
        }
        .omn-editor-dot.clean   { background: #3fb950; }
        .omn-editor-dot.dirty   { background: #ff5555; }
        .omn-editor-dot.loading { background: var(--text-dim); }
        .omn-editor-dot.error   { background: #ff5555; }
    </style>
</head>
<body class="omn-editor">
    <!-- The note name is shown in the status bar at the bottom ("Editing
         <name>"), so it is deliberately not repeated here. There is a single
         exit control (the × cancel button, which prompts on unsaved changes);
         a separate back arrow would duplicate it. -->
    <div class="omn-editor-bar">
        <span class="omn-editor-tools" id="editorTools"><!-- tool buttons injected by omn-go-editor.js --></span>
        <span class="omn-editor-spacer"></span>
        <button id="editorSave" type="button" title="Save (Ctrl+S)"><i class="material-icons">save</i></button>
        <button id="editorCancel" type="button" title="Cancel"><i class="material-icons">close</i></button>
    </div>
    <!-- Find / replace. Docked between the toolbar and the text rather than
         floating over it: this is the one search in the app where you need to
         see the thing you are changing WHILE you change it. Hidden until
         Ctrl+F / Ctrl+H or the toolbar button; the replace row is a second
         opt-in on top, because "search" is the common case and vertical space
         on a phone is not free.

         Note what these inputs deliberately do NOT carry: no spellcheck,
         autocorrect, autocapitalize or autocomplete. On Android those fold
         into the keyboard's NO_SUGGESTIONS flag, which disables the composing
         region every non-Latin layout needs - see the search overlay in
         omn-go-sse.js for the same rule and the bug that produced it. -->
    <div class="omn-editor-find" id="editorFind" hidden>
        <div class="omn-editor-find-row">
            <button id="findToggleReplace" type="button" class="editor-tool omn-find-chevron"
                    title="Show replace" aria-label="Show replace"><i class="material-icons">chevron_right</i></button>
            <input id="findInput" type="text" placeholder="Find" aria-label="Find" />
            <span class="omn-editor-find-count" id="findCount"></span>
            <button id="findPrev" type="button" class="editor-tool" title="Previous match (Shift+Enter)"
                    aria-label="Previous match"><i class="material-icons">keyboard_arrow_up</i></button>
            <button id="findNext" type="button" class="editor-tool" title="Next match (Enter)"
                    aria-label="Next match"><i class="material-icons">keyboard_arrow_down</i></button>
            <button id="findCase" type="button" class="editor-tool omn-find-flag" title="Match case"
                    aria-label="Match case" aria-pressed="false">Aa</button>
            <button id="findWord" type="button" class="editor-tool omn-find-flag" title="Whole word"
                    aria-label="Whole word" aria-pressed="false">ab</button>
            <button id="findRegex" type="button" class="editor-tool omn-find-flag" title="Regular expression"
                    aria-label="Regular expression" aria-pressed="false">.*</button>
            <button id="findClose" type="button" class="editor-tool" title="Close (Esc)"
                    aria-label="Close find"><i class="material-icons">close</i></button>
        </div>
        <div class="omn-editor-find-row omn-editor-replace-row" id="findReplaceRow" hidden>
            <span class="omn-find-chevron-space" aria-hidden="true"></span>
            <input id="replaceInput" type="text" placeholder="Replace with" aria-label="Replace with" />
            <button id="replaceOne" type="button" class="editor-tool omn-find-word" title="Replace this match">Replace</button>
            <button id="replaceAll" type="button" class="editor-tool omn-find-word" title="Replace every match">All</button>
        </div>
    </div>
    <div class="omn-editor-main">
        <div id="editorGutter" class="omn-editor-gutter" aria-hidden="true"></div>
        <!-- The textarea sits on a mirror layer that paints the find matches.
             A <textarea> cannot colour its own contents, and Chromium does not
             draw a selection in a textarea that is not focused - which it never
             is while you are typing in the find field. So the matches are drawn
             underneath: same text, same metrics, invisible ink, and a <mark>
             behind each hit showing through the transparent textarea.

             Every metric on .omn-editor-mirror must match #editor exactly, the
             same discipline the line-number gutter already needs. -->
        <div class="omn-editor-pane">
            <div id="editorMirror" class="omn-editor-mirror" aria-hidden="true"></div>
            <textarea id="editor" spellcheck="false" placeholder="Loading…" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
    </div>
    <div class="omn-editor-status">
        <span id="editorStatus">Loading…</span>
        <span id="editorDot" class="omn-editor-dot loading" title="Save state"></span>
    </div>

    <script src="/js/omn-go-editor.js"></script>
</body>
</html>
