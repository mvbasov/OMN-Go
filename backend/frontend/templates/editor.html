<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit: %%TITLE_HTML%%</title>
    <!-- Theme variables + Material Icons font come from the shared core
         stylesheet; the runtime marker below is replaced server-side with
         the data-theme setter so there is no flash of the wrong theme. -->
    <link rel="stylesheet" href="/css/OMN-Go/omn-go-core.css">
    <script>
      // Context for omn-go-editor.js. The note SOURCE is deliberately NOT
      // present here - the editor fetches it from /api/note on load, so a
      // rendered page never carries a second, hidden copy of its own text.
      var OMN_EDIT_NAME = '%%NAME_JS%%';
      var OMN_EDIT_EXT  = '%%PAGE_EXT_JS%%';
      var OMN_EDIT_VIEW = '%%VIEW_URL_JS%%';
    </script>
    <meta id="omn-go-runtime-vars-marker">
    <link rel="stylesheet" href="/css/OMN-Go/omn-go-editor.css">
</head>
<body class="omn-editor">
    <!-- The note name is shown in the status bar at the bottom ("Editing
         <name>"), so it is deliberately not repeated here. There is a single
         exit control (the × cancel button, which prompts on unsaved changes);
         a separate back arrow would duplicate it. -->
    <div class="omn-editor-bar">
        <span class="omn-editor-tools" id="omn-editor-tools"><!-- tool buttons injected by omn-go-editor.js --></span>
        <span class="omn-editor-spacer"></span>
        <button id="omn-editor-save" type="button" title="Save (Ctrl+S)"><i class="material-icons">save</i></button>
        <button id="omn-editor-cancel" type="button" title="Cancel"><i class="material-icons">close</i></button>
    </div>
    <!-- Find / replace. Docked between the toolbar and the text rather than
         floating over it: this is the one search in the app where you need to
         see the thing you are changing WHILE you change it. Hidden until
         Ctrl+F / Ctrl+H or the toolbar button; the replace row is a second
         opt-in on top, because "search" is the common case and vertical space
         on a phone is not free.

         Note what these inputs deliberately do NOT carry: no spellcheck,
         autocorrect, autocapitalize or autocomplete. Each one is a hint that
         the Android keyboard reads. autocomplete="off" sets its
         NO_SUGGESTIONS flag, which disables the composing region every
         non-Latin layout needs - see the search overlay in omn-go-search.js
         for the same rule and the bug that produced it. -->
    <div class="omn-editor-find" id="omn-editor-find" hidden>
        <div class="omn-editor-find-row">
            <button id="omn-find-toggle-replace" type="button" class="omn-find-chevron"
                    title="Show replace" aria-label="Show replace"><i class="material-icons">chevron_right</i></button>
            <input id="omn-find-input" type="text" placeholder="Find" aria-label="Find" />
            <span class="omn-editor-find-count" id="omn-find-count"></span>
            <button id="omn-find-prev" type="button" title="Previous match (Shift+Enter)"
                    aria-label="Previous match"><i class="material-icons">keyboard_arrow_up</i></button>
            <button id="omn-find-next" type="button" title="Next match (Enter)"
                    aria-label="Next match"><i class="material-icons">keyboard_arrow_down</i></button>
            <button id="omn-find-case" type="button" class="omn-find-flag" title="Match case"
                    aria-label="Match case" aria-pressed="false">Aa</button>
            <button id="omn-find-word" type="button" class="omn-find-flag" title="Whole word"
                    aria-label="Whole word" aria-pressed="false">ab</button>
            <button id="omn-find-regex" type="button" class="omn-find-flag" title="Regular expression"
                    aria-label="Regular expression" aria-pressed="false">.*</button>
            <button id="omn-find-close" type="button" title="Close (Esc)"
                    aria-label="Close find"><i class="material-icons">close</i></button>
        </div>
        <div class="omn-editor-find-row omn-editor-replace-row" id="omn-find-replace-row" hidden>
            <span class="omn-find-chevron-space" aria-hidden="true"></span>
            <input id="omn-replace-input" type="text" placeholder="Replace with" aria-label="Replace with" />
            <button id="omn-replace-one" type="button" class="omn-find-word" title="Replace this match">Replace</button>
            <button id="omn-replace-all" type="button" class="omn-find-word" title="Replace every match">All</button>
        </div>
    </div>
    <div class="omn-editor-main">
        <div id="omn-editor-gutter" class="omn-editor-gutter" aria-hidden="true"></div>
        <!-- The textarea sits on a mirror layer that paints the find matches.
             A <textarea> cannot color its own contents, and Chromium does not
             draw a selection in a textarea that is not focused - which it never
             is while you are typing in the find field. So the matches are drawn
             underneath: same text, same metrics, invisible ink, and a <mark>
             behind each hit showing through the transparent textarea.

             Every metric on .omn-editor-mirror must match #omn-editor-text exactly, the
             same discipline the line-number gutter already needs.

             spellcheck="false" keeps the keyboard menu away. A red underline
             marks a word that the spell check does not know, and code is full
             of such words. A tap on such a word opens a menu ("Add to
             dictionary", "Delete"). That menu takes the focus, thus the
             keyboard closes. The keyboard still shows its suggestions:
             Chromium does not tell the keyboard about spellcheck, and only
             autocomplete="off" sets NO_SUGGESTIONS. See computeEditorInfo in
             content/browser/input/ImeUtils.java of Chromium. -->
        <div class="omn-editor-pane">
            <div id="omn-editor-mirror" class="omn-editor-mirror" aria-hidden="true"></div>
            <textarea id="omn-editor-text" spellcheck="false" placeholder="Loading…" autocapitalize="off" autocomplete="on"></textarea>
        </div>
    </div>
    <div class="omn-editor-status">
        <span id="omn-editor-status">Loading…</span>
        <span id="omn-editor-dot" class="omn-editor-dot omn-loading" title="Save state"></span>
    </div>

    <!-- The dialogs of the application. This page has no omn-go-api.js,
         which loads the file on demand on the other pages. -->
    <script src="/js/OMN-Go/omn-go-dialog.js"></script>
    <script src="/js/OMN-Go/omn-go-editor.js"></script>
</body>
</html>
