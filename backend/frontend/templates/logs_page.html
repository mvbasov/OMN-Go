<div class="omn-card">
    <h2 class="omn-card-title">Log</h2>
    <div class="omn-card-field">
        <span class="omn-card-hint">What this device wrote. The page reads <code>/api/logs/history</code> one time, and then it adds each new line from <code>/api/logs</code>. The Download and the Upload button of the header above work here, so a sync writes into this view while you watch it.</span>
    </div>

    <div class="omn-lg-actions">
        <button type="button" class="omn-btn" id="omn-lg-reload">Reload</button>
        <button type="button" class="omn-btn" id="omn-lg-copy">Copy</button>
        <button type="button" class="omn-btn" id="omn-lg-filter-toggle">Filter</button>
        <a class="omn-btn" href="/api/logs/history">Open as JSON</a>
        <span class="omn-lg-count" id="omn-lg-count"></span>
    </div>

    <div id="omn-lg-filter" class="omn-lg-filter omn-hidden">
        <div class="omn-lg-filter-row">
            <span class="omn-lg-filter-name">Level</span>
            <span id="omn-lg-levels"></span>
        </div>
        <div class="omn-lg-filter-row">
            <span class="omn-lg-filter-name">Tag</span>
            <span id="omn-lg-tags"></span>
        </div>
    </div>

    <div id="omn-lg-body" class="omn-lg-body">Loading…</div>
</div>
