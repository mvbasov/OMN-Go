<div class="omn-ext-edit-panel">
    <div class="omn-ext-edit-icon">📝</div>
    <h2 class="omn-ext-edit-title">Editing Externally</h2>
    <p class="omn-ext-edit-msg">
        We have launched <strong>%%CMD%%</strong> to edit <code>%%FILE_NAME%%</code>. Please complete your changes in your editor, save the file, and click the button below to view the updated file.
    </p>
    <button data-action="replace-location" data-arg="/%%VIEW_URL_ATTR%%" class="omn-ext-edit-btn">
        Press after edit to refresh view
    </button>
</div>
