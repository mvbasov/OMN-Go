<!DOCTYPE html>

    <title>%%TITLE_HTML%%</title>
    <script>
    /* omn-go-compat: the one script in this application written in ES5.
     *
     * WHY IT IS INLINE AND WHY IT IS ES5. Every other script here uses
     * async/await, arrow functions and template literals, and a WebView that
     * cannot parse those throws a SyntaxError and drops the WHOLE file - so
     * the very code that would report the problem is the code that does not
     * run. This block is inline (no request to fail, no cache to be stale)
     * and holds nothing newer than ES5, so it parses on any WebView that
     * this application can be installed on.
     *
     * THE NUMBER. 85 is the highest requirement the frontend actually has:
     * String.replaceAll, in Bookmarker.js and the editor. Below that things
     * throw rather than degrade. Chromium 44 is what Android 6 ships, and
     * Chromium 106 is what its System WebView updates to, so on that release
     * of Android this notice is the difference between a blank page and a
     * sentence saying which update is missing.
     *
     * It says nothing on a browser with no Chrome token in its user agent -
     * Firefox and Safari are not measured by this number and do not need to
     * be warned about it.
     */
    (function () {
        var MIN = 85;
        var m = /Chrome\/(\d+)/.exec(navigator.userAgent || '');
        if (!m || parseInt(m[1], 10) >= MIN) { return; }
        var found = m[1];
        function show() {
            if (!document.body || document.getElementById('omnGoCompat')) { return; }
            var bar = document.createElement('div');
            bar.id = 'omnGoCompat';
            /* Inline styles on purpose: the stylesheet is built on CSS
               custom properties, which a WebView this old does not have. */
            bar.setAttribute('style', 'position:relative;z-index:99999;'
                + 'padding:10px 34px 10px 12px;margin:0;'
                + 'background:#8a1c1c;color:#ffffff;'
                + 'font:14px/1.4 sans-serif;');
            bar.appendChild(document.createTextNode(
                'This browser is too old for OMN-Go. It is Chromium ' + found
                + ' and OMN-Go needs ' + MIN + ' or newer. On Android, update'
                + ' "Android System WebView" and Chrome, then start OMN-Go'
                + ' again. Until then this page can be incomplete or empty.'));
            var x = document.createElement('span');
            x.setAttribute('style', 'position:absolute;top:6px;right:10px;'
                + 'cursor:pointer;font-weight:bold;');
            x.appendChild(document.createTextNode('\u2715'));
            x.onclick = function () {
                if (bar.parentNode) { bar.parentNode.removeChild(bar); }
            };
            bar.appendChild(x);
            document.body.insertBefore(bar, document.body.firstChild);
        }
        if (document.addEventListener) {
            document.addEventListener('DOMContentLoaded', show, false);
        }
        /* A second chance: DOMContentLoaded has fired already if this page
           came from the cache, and window.onload is the older event that
           every WebView here has. */
        if (window.addEventListener) {
            window.addEventListener('load', show, false);
        } else {
            window.attachEvent('onload', show);
        }
    })();
    </script>

<body>
    <div id="mainUI" class="page_container">

                <div class="header-actions">
                    <a href="%%ASSET_PREFIX%%Welcome.html"><i class="material-icons">home</i></a>
                    <button onclick="createNewPage()" class="admin-only server-only btn-create-page"><i class="material-icons">note_add</i></button>
                    <button onclick="toggleQuickPanel()" class="admin-only server-only btn-quick-note"><i class="material-icons">insert_comment</i></button>
                    <button onclick="toggleBookmarkPanel()" class="admin-only server-only btn-add-bookmark"><i class="material-icons">bookmark_add</i></button>
                    <button onclick="createNoteShortcut()" class="android-only btn-add-shortcut" title="Add to home screen"><i class="material-icons">add_to_home_screen</i></button>
                    <button onclick="refreshPage()" class="admin-only btn-refresh"><i class="material-icons">refresh</i></button>
                    <a href="#" onclick="window.location.replace('/Config.html'); return false;" class="btn-settings server-only"><i class="material-icons">settings</i></a>
                    <button onclick="syncAction('download')" class="admin-only server-only" title="Download (Pull)"><i class="material-icons">cloud_download</i></button>
                    <button onclick="syncAction('upload')" class="admin-only server-only" title="Upload (Push)"><i class="material-icons">cloud_upload</i></button>
                    <button onclick="omnSearchOpen()" class="server-only btn-search" title="Search this page (Ctrl-K or /)"><i class="material-icons">search</i></button>
                    <button id="metaToggleBtn" onclick="var p=document.getElementById('metadataPanel');p.classList.toggle('hidden');" class="btn-metadata-toggle" title="Toggle metadata"><i class="material-icons">info</i></button>
                    <button id="toggleBtn" onclick="window.location.href = window.location.pathname + '?edit=true'" class="admin-only server-only" title="Edit"><i class="material-icons">edit</i></button>
                </div>
                <div id="headerTags">%%TAGS_HTML%%</div>
            </div>
            <h4 id="pageTitle" class="page-title" onclick="toggleHeader()">
                %%TITLE_HTML%%
                <span id="title_arrow" class="title-arrow">+</span>
            </h4>
        </div>

        <div id="content" class="page-content">
            <div id="metadataPanel" class="hidden metadata-panel"></div>
