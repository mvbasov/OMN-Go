<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>%%TITLE_HTML%%</title>
    <!-- Keep first. See the banner of omn-go-compat.js. -->
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-compat.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-console.js"></script>
    <link rel="stylesheet" href="%%ASSET_PREFIX%%css/OMN-Go/omn-go-core.css">
    <link rel="stylesheet" href="%%ASSET_PREFIX%%css/OMN-Go/highlight.default.min.css">
    <link rel="stylesheet" href="%%ASSET_PREFIX%%css/OMN-Go/katex.min.css">
%%PAGE_STYLES%%    <link rel="stylesheet" href="%%ASSET_PREFIX%%css/omn-go-custom.css">
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-core.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-highlight.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-nav.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-share.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/omn-go-api.js"></script>
%%META_TAGS%%
    <script>
      var PackageName = '%%PACKAGE_JS%%';
      var PageName = '%%PAGE_NAME_JS%%';
      var Title = '%%TITLE_JS%%';
      var PAGE_EXT = '%%PAGE_EXT_JS%%';
      var currentNote = '%%PAGE_NAME_JS%%';
    </script>
%%COND_SCRIPTS%%
    <meta id="omn-go-runtime-vars-marker">
</head>
<body>
    <div id="mainUI" class="page_container">
        <div id="ptitle" class="page-header">
            <div id="hidable_header" class="collapsible-header hidden">
                <div class="header-actions">
                    <a href="%%ASSET_PREFIX%%Welcome.html"><i class="material-icons">home</i></a>
                    <button data-action="new-page" class="admin-only server-only btn-create-page"><i class="material-icons">note_add</i></button>
                    <button data-action="toggle-panel" data-arg="quickPanel" class="admin-only server-only btn-quick-note"><i class="material-icons">insert_comment</i></button>
                    <button data-action="bookmark-panel" class="admin-only server-only btn-add-bookmark"><i class="material-icons">bookmark_add</i></button>
                    <button data-action="add-shortcut" class="android-only btn-add-shortcut" title="Add to home screen"><i class="material-icons">add_to_home_screen</i></button>
                    <button data-action="refresh-page" class="admin-only btn-refresh"><i class="material-icons">refresh</i></button>
                    <a href="#" data-action="replace-location" data-arg="/Config.html" class="btn-settings server-only"><i class="material-icons">settings</i></a>
                    <button data-action="sync" data-arg="download" class="admin-only server-only" title="Download (Pull)"><i class="material-icons">cloud_download</i></button>
                    <button data-action="sync" data-arg="upload" class="admin-only server-only" title="Upload (Push)"><i class="material-icons">cloud_upload</i></button>
                    <button data-action="search" class="server-only btn-search" title="Search this page (Ctrl-K or /)"><i class="material-icons">search</i></button>
                    <button id="metaToggleBtn" data-action="toggle-panel" data-arg="metadataPanel" class="btn-metadata-toggle" title="Toggle metadata"><i class="material-icons">info</i></button>
                    <button id="toggleBtn" data-action="edit-page" class="admin-only server-only" title="Edit"><i class="material-icons">edit</i></button>
                </div>
                <div id="headerTags">%%TAGS_HTML%%</div>
            </div>
            <h4 id="pageTitle" class="page-title" data-action="toggle-header">
                %%TITLE_HTML%%
                <span id="title_arrow" class="title-arrow">+</span>
            </h4>
        </div>

        <div id="content" class="page-content">
            <div id="metadataPanel" class="hidden metadata-panel"></div>
            <div id="preview">%%PREVIEW_BODY%%</div>
        </div>
    </div>

    <div id="status" class="page-footer">
        <span class="version-footer-inline" id="omn-go-version-footer"></span>
        <span id="omn-go-console-footer-dot" title="JS console has messages — tap to open"></span>
    </div>

    <div id="omn-go-modals-slot"></div>

    <script src="%%ASSET_PREFIX%%js/OMN-Go/highlight.min.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/katex.min.js"></script>
    <script src="%%ASSET_PREFIX%%js/OMN-Go/auto-render.min.js"></script>
    <script src="%%ASSET_PREFIX%%js/omn-go-custom.js"></script>
</body>
</html>
