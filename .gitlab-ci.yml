stages:
  - build
  - upload
  - release

# Global variables must live outside the default block.
variables:
  DOCKER_TLS_CERTDIR: "/certs"
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omn-go/${APP_VERSION}"

default:
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind

build_job:
  stage: build
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "DS"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
    - if: $CI_COMMIT_TAG =~ /^v/
  # A local buildx cache fills the runner's small disk. Cache to the registry.

  # The Docker-in-Docker daemon is not up when the job starts.
  before_script:
    - |
      echo "Waiting for Docker daemon to start..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker daemon is ready!"
          break
        fi
        echo "Still waiting..."
        sleep 1
      done

  script:
    # buildx reads the DinD TLS endpoint from an explicit context, not the env.
    - docker context create builder
    - docker buildx create --use --driver docker-container --name omngo-builder builder
    # /tmp is outside the build context, so `COPY . .` never takes the keystore.
    - echo "${KEYSTORE_BASE64}" | base64 -d > /tmp/omn-go.keystore
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${CI_REGISTRY}"
    # Loading the multi-GB toolchain image into the daemon fills the runner's
    # disk, so export only the build outputs. A failed cache push is not fatal.
    - |
      docker buildx build \
        -f Dockerfile.ci \
        --target export \
        --output type=local,dest=artifacts \
        --secret id=keystore,src=/tmp/omn-go.keystore \
        --secret id=keystore_password,env=KEYSTORE_PASSWORD \
        --secret id=key_alias,env=KEY_ALIAS \
        --secret id=key_password,env=KEY_PASSWORD \
        --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache \
        --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max,ignore-error=true \
        .
    - rm -f /tmp/omn-go.keystore
    # BusyBox grep has no -P, so use awk.
    - VERSION=$(awk -F'"' '/APP_VERSION[[:space:]]*=/{print $2; exit}' backend/version.go)
    - echo "APP_VERSION=$VERSION" >> build.env
    - echo "App version is $VERSION"
    - ls -la artifacts/
  artifacts:
    name: "omn-go-artifacts"
    expire_in: 8 hours
    paths:
      - artifacts/
    reports:
      dotenv: build.env

upload_job:
  stage: upload
  image: badouralix/curl-jq:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  dependencies:
    - build_job
  script:
    # Re-derive APP_VERSION rather than trust the dotenv hand-off. An empty
    # value strips the version segment and GitLab rejects the PUTs. Anchor on
    # the `=` so the unquoted doc comment line cannot match first.
    - APP_VERSION=$(awk -F'"' '/APP_VERSION[[:space:]]*=/{print $2; exit}' backend/version.go)
    - '[ -n "$APP_VERSION" ] || { echo "ERROR: APP_VERSION is empty, aborting"; exit 1; }'
    - echo "Generating SHA256 checksums and uploading all assets for version $APP_VERSION..."
    - echo "[" > assets.json
    - first=true

    - |
      for filepath in artifacts/*.apk artifacts/omn-go-*-desktop-*; do
        if [ -f "$filepath" ]; then
          filename=$(basename "$filepath")
          sha256sum "$filepath" | awk '{print $1}' > "${filepath}.sha256"
          sha_filename="${filename}.sha256"

          echo "Uploading $filename..."
          # Plain curl exits 0 on an HTTP error and leaves the job green.
          curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
               --upload-file "$filepath" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omn-go/${APP_VERSION}/${filename}"

          echo "Uploading checksum for $filename..."
          curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
               --upload-file "${filepath}.sha256" \
               "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omn-go/${APP_VERSION}/${sha_filename}"

          display_name=$(echo "$filename" | sed 's/omn-go-//g' | sed 's/-release//g')

          if [ "$first" = true ]; then
            first=false
          else
            echo "," >> assets.json
          fi

          echo "{\"name\":\"📦 $display_name\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omn-go/${APP_VERSION}/${filename}\",\"link_type\":\"package\"}" >> assets.json
          echo "," >> assets.json
          echo "{\"name\":\"🔑 $display_name (SHA256)\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/omn-go/${APP_VERSION}/${sha_filename}\",\"link_type\":\"other\"}" >> assets.json
        fi
      done

    - echo "]" >> assets.json
    - cat assets.json
    # An empty assets.json means nothing uploaded. Fail rather than publish.
    - '[ "$(cat assets.json)" != "[]" ] || { echo "ERROR: no artifacts matched, nothing uploaded"; exit 1; }'
  artifacts:
    expire_in: 8 hours
    paths:
      - assets.json
    reports:
      dotenv: build.env

release_job:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  dependencies:
    - upload_job
  # glab authenticates with GITLAB_TOKEN. CI_JOB_TOKEN gets a 403 here, so
  # RELEASE_TOKEN must be a masked token with `api` scope and the Developer role.
  variables:
    GITLAB_TOKEN: "$RELEASE_TOKEN"
  script:
    # APP_VERSION does not reach here, so take the name from CI_COMMIT_TAG.
    - echo "Publishing release for tag $CI_COMMIT_TAG..."
    - |
      glab release create "$CI_COMMIT_TAG" \
        --name "OMN-Go $CI_COMMIT_TAG" \
        --notes "Release created automatically by GitLab CI/CD pipeline. Use the associated SHA256 links below to verify package integrity." \
        --assets-links "$(cat assets.json)"
