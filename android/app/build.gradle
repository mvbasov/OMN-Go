plugins {
    id 'com.android.application'
}

android {
    namespace 'net.basov.omngo'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "net.basov.omngo"
        minSdk 24
        targetSdk 34
        versionCode 2608006
        versionName "26.08.6"
    }


    // The fdroid flavor needs its own applicationId, not an ID suffix, so
    // both channels install side by side and the two signing keys never
    // collide. Flavors also rename the Gradle tasks: assembleRelease is now
    // an umbrella over assembleStandardRelease and assembleFdroidRelease.
    flavorDimensions "distribution"
    productFlavors {
        standard {
            dimension "distribution"
            buildConfigField "int", "DEFAULT_SERVER_PORT", "8080"
        }
        fdroid {
            dimension "distribution"
            // TODO: confirm this spelling before the first submission.
            applicationId "net.basov.omngo.fdroid"
            versionNameSuffix "-fdroid"
            // The loopback port is device-global, so the flavors must differ.
            buildConfigField "int", "DEFAULT_SERVER_PORT", "8081"
        }
    }

    // AGP 8 does not generate BuildConfig by default. The flavors need it.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // KEYSTORE_FILE points CI at a secret mount, keeping the
            // keystore out of every image layer.
            storeFile file(System.getenv("KEYSTORE_FILE") ?: 'omn-go.keystore')
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "fallback"
            keyAlias System.getenv("KEY_ALIAS") ?: "omn-go"
            keyPassword System.getenv("KEY_PASSWORD") ?: "fallback"
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "omn-go-v${variant.versionName}-${output.baseName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Per-ABI versionCode assignment, applied to the fdroid flavor only.
apply from: 'fdroid-abi-versioncode.gradle'

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}

// The WebViewClient URL loading API in use is deprecated but still needed.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xlint:-deprecation"]
}
